; MedCapsule Production OPcache Configuration
; This file should be placed in your PHP configuration directory
; Typically: /etc/php/8.1/fpm/php.ini or /usr/local/etc/php/php.ini

[opcache]
; Enable OPcache
opcache.enable=1
opcache.enable_cli=1

; Memory allocation
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000

; File update protection
opcache.file_update_protection=2
opcache.revalidate_freq=60

; Fast shutdown
opcache.fast_shutdown=1
opcache.enable_file_override=1

; JIT Compiler (PHP 8.0+)
opcache.jit=disable
opcache.jit_buffer_size=64M

; Error handling
opcache.error_log=/var/log/php/opcache.log

; Development vs Production settings
opcache.validate_timestamps=1
opcache.file_cache_only=0

; Performance optimizations
opcache.huge_code_pages=1
opcache.consistency_checks=0
opcache.dups_fix=0

; Security
opcache.blacklist_filename=/etc/php/opcache-blacklist.txt

; Preloading (PHP 7.4+)
; opcache.preload=/path/to/preload.php

; Maximum cached keys
opcache.max_wasted_percentage=5
