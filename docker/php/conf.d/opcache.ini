opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.revalidate_freq=0
; validate_timestamps=0: PHP will NOT check files for changes between requests.
; Production containers are immutable, so this is safe and eliminates a stat()
; syscall per file per request. After any deployment, the container is rebuilt
; from scratch, so OPcache is always cold and correct on startup.
opcache.validate_timestamps=0
opcache.fast_shutdown=1
opcache.enable_cli=0
