<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Grant Access Frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h2>🚀 Grant Access Frontend Test</h2>
        
        <div class="card">
            <div class="card-header">
                <h5>Grant Course Access</h5>
            </div>
            <div class="card-body">
                <form id="enrollmentForm">
                    <div class="mb-3">
                        <label class="form-label">Select User</label>
                        <select class="form-control" id="user_id" name="user_id" required>
                            <option value="">Select a user...</option>
                            <option value="1">Admin (admin@example.com)</option>
                            <option value="2">Student (student@example.com)</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Select Course</label>
                        <select class="form-control" id="course_id" name="course_id" required>
                            <option value="">Select a course...</option>
                            <option value="1">Internal Medicine</option>
                            <option value="2">Surgery</option>
                            <option value="3">Pediatrics</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="send_notification" name="send_notification">
                            <label class="form-check-label" for="send_notification">
                                Send notification to user
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="immediate_access" name="immediate_access" checked>
                            <label class="form-check-label" for="immediate_access">
                                Grant immediate access
                            </label>
                        </div>
                    </div>
                    
                    <div class="row g-2">
                        <div class="col-6">
                            <button type="submit" class="btn btn-success w-100" id="grantAccessBtn">
                                <i class="fas fa-check me-2"></i>Grant Access
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-danger w-100" id="revokeAccessBtn">
                                <i class="fas fa-user-times me-2"></i>Toggle Access
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="mt-4">
            <h5>Test Results</h5>
            <div id="testResults" class="alert alert-info">
                Ready to test...
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            console.log('🚀 Frontend test loaded');
            
            // Function to show alerts
            function showAlert(message, type) {
                const alertClass = type === 'success' ? 'alert-success' : 
                                 type === 'danger' ? 'alert-danger' : 
                                 type === 'warning' ? 'alert-warning' : 'alert-info';
                
                $('#testResults').removeClass().addClass('alert ' + alertClass).text(message);
            }
            
            // Button loading functions
            function showButtonLoading(buttonId, originalText) {
                const btn = $(buttonId);
                btn.data('original-text', originalText || btn.text());
                btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin me-2"></i>Processing...');
            }

            function hideButtonLoading(buttonId) {
                const btn = $(buttonId);
                btn.prop('disabled', false);
                const originalText = btn.data('original-text') || 'Grant Access';
                btn.html(originalText);
            }
            
            // Enable/disable buttons based on selections
            function checkButtonStates() {
                const userId = $('#user_id').val();
                const courseId = $('#course_id').val();
                
                console.log('🔍 Checking button states - User:', userId, 'Course:', courseId);
                
                if (userId && courseId) {
                    $('#grantAccessBtn').prop('disabled', false).removeClass('disabled');
                    $('#revokeAccessBtn').prop('disabled', false).removeClass('disabled');
                    showAlert('Both user and course selected - buttons enabled', 'success');
                } else {
                    $('#grantAccessBtn').prop('disabled', true).addClass('disabled');
                    $('#revokeAccessBtn').prop('disabled', true).addClass('disabled');
                    showAlert('Please select both user and course', 'warning');
                }
            }
            
            // Initialize button states
            checkButtonStates();
            
            // Handle selection changes
            $('#user_id, #course_id').on('change', function() {
                checkButtonStates();
            });
            
            // Grant Access Form Handler
            $('#enrollmentForm').on('submit', function(e) {
                e.preventDefault();
                
                const userId = $('#user_id').val();
                const courseId = $('#course_id').val();
                
                console.log('🚀 Grant Access - User ID:', userId, 'Course ID:', courseId);
                
                if (!userId || !courseId) {
                    showAlert('Please select both user and course', 'warning');
                    return;
                }

                showButtonLoading('#grantAccessBtn');
                showAlert('Sending grant access request...', 'info');

                const formData = {
                    user_id: userId,
                    course_id: courseId,
                    send_notification: $('#send_notification').is(':checked') || false,
                    immediate_access: $('#immediate_access').is(':checked') || false,
                    _token: 'test-token' // This would be the real CSRF token
                };
                
                console.log('📤 Form data:', formData);

                // Simulate AJAX request
                setTimeout(() => {
                    hideButtonLoading('#grantAccessBtn');
                    
                    // Simulate successful response
                    const response = {
                        success: true,
                        message: `User ${userId} enrolled in course ${courseId} successfully.`,
                        enrollment: {
                            user_id: userId,
                            user_name: $('#user_id option:selected').text().split(' ')[0],
                            user_email: $('#user_id option:selected').text().match(/\((.*?)\)/)[1],
                            course_id: courseId,
                            course_name: $('#course_id option:selected').text()
                        }
                    };
                    
                    if (response.success) {
                        showAlert(response.message, 'success');
                        console.log('✅ Grant access successful:', response);
                        
                        // Reset course selection but keep user selected
                        $('#course_id').val('');
                        checkButtonStates();
                    } else {
                        showAlert(response.message || 'Failed to grant access', 'danger');
                    }
                }, 1000);
            });
            
            // Revoke Access Button Handler
            $('#revokeAccessBtn').on('click', function() {
                const userId = $('#user_id').val();
                const courseId = $('#course_id').val();
                
                console.log('🔥 Revoke Access - User ID:', userId, 'Course ID:', courseId);
                
                if (!userId || !courseId) {
                    showAlert('Please select both user and course', 'warning');
                    return;
                }
                
                showAlert('This would toggle access for the selected user/course', 'info');
            });
            
            console.log('✅ All event handlers attached');
        });
    </script>
</body>
</html>
