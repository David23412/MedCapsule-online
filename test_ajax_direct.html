<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct AJAX Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Direct AJAX Test for Grant Access</h1>
    
    <div>
        <label>User ID:</label>
        <input type="number" id="user_id" value="1" min="1">
    </div>
    
    <div>
        <label>Course ID:</label>
        <input type="number" id="course_id" value="1" min="1">
    </div>
    
    <button id="testButton">Test Grant Access AJAX</button>
    
    <div id="results" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;">
        Results will appear here...
    </div>

    <script>
        $(document).ready(function() {
            console.log('🚨 Direct AJAX test loaded');
            
            $('#testButton').click(function() {
                console.log('🚨 Test button clicked');
                
                const userId = $('#user_id').val();
                const courseId = $('#course_id').val();
                
                console.log('User ID:', userId, 'Course ID:', courseId);
                
                const formData = {
                    user_id: userId,
                    course_id: courseId,
                    send_notification: false,
                    immediate_access: true,
                    _token: 'test-token' // This would need to be a real CSRF token
                };
                
                console.log('Sending AJAX request...');
                $('#results').html('Sending request...');
                
                $.ajax({
                    url: '/manage-access/enroll',
                    method: 'POST',
                    data: formData,
                    beforeSend: function() {
                        console.log('AJAX beforeSend triggered');
                    },
                    success: function(response) {
                        console.log('AJAX Success:', response);
                        $('#results').html('<strong>Success:</strong> ' + JSON.stringify(response, null, 2));
                    },
                    error: function(xhr, status, error) {
                        console.log('AJAX Error:', xhr, status, error);
                        $('#results').html('<strong>Error:</strong> ' + xhr.status + ' - ' + xhr.responseText);
                    }
                });
            });
        });
    </script>
</body>
</html>
