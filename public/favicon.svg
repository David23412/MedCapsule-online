<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="pill">
      <rect x="3" y="10" width="26" height="12" rx="6" ry="6"/>
    </clipPath>
  </defs>
  <g clip-path="url(#pill)">
    <!-- Blue half (left) -->
    <rect fill="#3579F6" x="3" y="10" width="13" height="12"/>
    <!-- Red half (right) -->
    <rect fill="#ff0000" x="16" y="10" width="13" height="12"/>
  </g>
  <!-- White dashed divider -->
  <line x1="16" y1="10" x2="16" y2="22" stroke="white" stroke-width="1" stroke-dasharray="2,1"/>
</svg>