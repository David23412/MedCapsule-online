<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulletproof Confetti Test</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
        
        .test-container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        button {
            margin: 10px;
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .perfect { background: #FFD700; color: #333; }
        .good { background: #00CED1; color: white; }
        .achievement { background: #96CEB4; color: white; }
        
        button:hover { transform: translateY(-2px); }
        
        /* NUCLEAR SIMPLE CONFETTI */
        canvas {
            z-index: 10002 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎉 Bulletproof Confetti Test</h1>
        <p>Test the confetti positioning across all browsers including Safari</p>
        
        <button class="perfect" onclick="testPerfectConfetti()">Perfect Score Confetti</button>
        <button class="good" onclick="testGoodConfetti()">Good Score Confetti</button>
        <button class="achievement" onclick="testAchievementConfetti()">Achievement Confetti</button>
        <button onclick="testDirectConfetti()">Direct Center Confetti</button>
    </div>

    <script src="/js/confetti-manager.js"></script>
    <script>
        function testPerfectConfetti() {
            if (typeof ConfettiManager !== 'undefined') {
                ConfettiManager.triggerModalConfetti('perfect');
            }
        }
        
        function testGoodConfetti() {
            if (typeof ConfettiManager !== 'undefined') {
                ConfettiManager.triggerModalConfetti('good');
            }
        }
        
        function testAchievementConfetti() {
            if (typeof ConfettiManager !== 'undefined') {
                ConfettiManager.triggerModalConfetti('achievement');
            }
        }
        
        function testDirectConfetti() {
            // Direct confetti test - bulletproof center positioning
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { x: 0.5, y: 0.5 },
                colors: ['#FF6B6B', '#4ECDC4', '#45B7D1'],
                zIndex: 10002,
                startVelocity: 30,
                decay: 0.9,
                gravity: 1
            });
        }
    </script>
</body>
</html>
