<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="capsuleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Medical capsule design -->
  <rect x="6" y="12" width="20" height="8" rx="4" ry="4" fill="url(#capsuleGradient)"/>
  <!-- Dashed line divider -->
  <line x1="16" y1="12" x2="16" y2="20" stroke="white" stroke-width="1" stroke-dasharray="2,1"/>
  <!-- Small medical cross -->
  <g fill="white" opacity="0.8">
    <rect x="15" y="8" width="2" height="6"/>
    <rect x="13" y="10" width="6" height="2"/>
  </g>
</svg>