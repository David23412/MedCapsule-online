<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="pillBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pillRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <!-- Blue half (left) — lean capsule -->
  <path d="M16,12 L9,12 A4,4 0 0,0 9,20 L16,20 Z" fill="url(#pillBlue)"/>
  <!-- Red half (right) — lean capsule -->
  <path d="M16,12 L23,12 A4,4 0 0,1 23,20 L16,20 Z" fill="url(#pillRed)"/>
  <!-- White divider line -->
  <line x1="16" y1="12" x2="16" y2="20" stroke="white" stroke-width="0.8"/>
</svg>