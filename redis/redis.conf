# Redis Configuration for MedCapsule Production
# Optimized for high-performance caching and session storage

# Network Configuration
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# General Settings
daemonize no
supervised no
loglevel notice
logfile "/var/log/redis/redis.log"

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Configuration
save 900 1
save 300 10
save 60 10000

# RDB Configuration
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# AOF Configuration (for better durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Security Configuration
requirepass your_secure_password_here
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command SHUTDOWN SHUTDOWN_REDIS
rename-command CONFIG CONFIG_REDIS

# Connection Limits
maxclients 10000
maxclients-timeout 300

# Performance Tuning
hz 10
tcp-backlog 511

# Disable dangerous commands
rename-command KEYS ""
rename-command EVAL ""
rename-command EVALSHA ""

# Enable Redis modules if needed
# loadmodule /path/to/redisearch.so

# Cluster settings (if using Redis Cluster)
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000

# Sentinel settings (if using Redis Sentinel)
# sentinel monitor mymaster 127.0.0.1 6379 2
# sentinel down-after-milliseconds mymaster 30000
# sentinel parallel-syncs mymaster 1
# sentinel failover-timeout mymaster 180000

# Slow log for performance monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128

# Event notification
notify-keyspace-events Ex

# Advanced settings for production
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Lua scripting timeout
lua-time-limit 5000

# Redis Insight configuration
# Enable if you want remote access from RedisInsight
# protected-mode no
