name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medcapsule_test
          MYSQL_USER: medcapsule
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd
        tools: composer:v2

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Use CI Environment File
      run: cp .env.ci .env

    - name: Install PHP Dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Install JS Dependencies
      run: npm ci

    - name: Generate Laravel App Key
      run: php artisan key:generate

    - name: Set Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Wait for MySQL to be ready
      run: |
        echo "Waiting for MySQL..."
        for i in {1..30}; do
          if mysqladmin ping -h"127.0.0.1" -uroot -proot --silent; then
            echo "MySQL is up!"
            break
          fi
          sleep 2
        done

    - name: Run Migrations
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: medcapsule_test
        DB_USERNAME: medcapsule
        DB_PASSWORD: secret
      run: php artisan migrate --force

    - name: Run PHPUnit Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: medcapsule_test
        DB_USERNAME: medcapsule
        DB_PASSWORD: secret
      run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

    - name: Run Payment Security Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: medcapsule_test
        DB_USERNAME: medcapsule
        DB_PASSWORD: secret
      run: vendor/bin/phpunit tests/Feature/PaymentSecurityTest.php --verbose

    - name: Build Frontend Assets
      run: npm run build

    - name: Run Composer Security Audit
      run: composer audit

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Snyk CLI
      run: npm install -g snyk

    - name: Authenticate Snyk CLI
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: snyk auth $SNYK_TOKEN

    - name: Run Snyk Scan (All Projects + SARIF Output)
      run: snyk test --all-projects --sarif-file-output=snyk.sarif || true
      continue-on-error: true

    - name: Upload Security Results to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: snyk.sarif