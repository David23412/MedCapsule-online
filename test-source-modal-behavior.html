<!DOCTYPE html>
<html>
<head>
    <title>Test Source Modal Behavior</title>
</head>
<body>
    <h1>Testing Source Modal Logic</h1>
    
    <!-- Regular Topic Card (should show modal) -->
    <div class="topic-card" data-topic-id="1">
        <a href="/quiz/1/1" class="start-quiz-btn" data-topic-id="1" data-course-id="1">
            Regular Topic - Start Quiz
        </a>
    </div>
    
    <!-- Assignment Topic Card (should skip modal) -->
    <div class="topic-card" data-topic-id="2" data-has-assignment="true">
        <a href="/quiz/1/2?assignment_id=123" class="start-quiz-btn assignment-start-btn" data-topic-id="2" data-course-id="1">
            Assignment Topic - Start Assignment
        </a>
    </div>
    
    <script>
        // Simulate the logic from the main file
        const quizButtons = document.querySelectorAll('.start-quiz-btn');
        
        quizButtons.forEach((button) => {
            const originalHref = button.href;
            button.removeAttribute('href');
            button.style.cursor = 'pointer';
            
            button.addEventListener('click', function(e) {
                e.preventDefault();
                
                const topicId = this.dataset.topicId;
                const courseId = this.dataset.courseId;
                
                // Check if this topic is part of an assignment
                const topicCard = document.querySelector(`[data-topic-id="${topicId}"]`);
                if (topicCard && topicCard.dataset.hasAssignment === 'true') {
                    // Topic is assigned - redirect directly without showing source modal
                    console.log(`Assignment Topic ${topicId}: Skipping source modal, going directly to quiz`);
                    alert(`Assignment Topic ${topicId}: Would redirect directly to: ${originalHref}`);
                    return false;
                }
                
                // Regular topic - show source modal
                console.log(`Regular Topic ${topicId}: Showing source modal`);
                alert(`Regular Topic ${topicId}: Would show source selection modal`);
            });
        });
    </script>
</body>
</html>
