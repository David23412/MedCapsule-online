<!DOCTYPE html>
<html>
<head>
    <title>Debug Source Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Debug Source Modal Behavior</h1>
        
        <!-- Regular Topic Card -->
        <div class="topic-card mb-3" data-case-type="clinical" data-topic-id="1" data-has-assignment="false">
            <h3>Regular Topic Card</h3>
            <a href="/quiz/1/1" class="start-quiz-btn btn btn-primary" data-topic-id="1" data-course-id="1">
                Start Quiz (Should show modal)
            </a>
        </div>
        
        <!-- Assignment Topic Card -->
        <div class="topic-card mb-3" data-case-type="clinical" data-topic-id="2" data-has-assignment="true">
            <h3>Assignment Topic Card</h3>
            <a href="/quiz/1/2?assignment_id=123" class="start-quiz-btn assignment-start-btn btn btn-warning" data-topic-id="2" data-course-id="1">
                Start Assignment (Should skip modal)
            </a>
        </div>
    </div>

    <!-- Source Selection Modal -->
    <div class="modal fade" id="sourceSelectionModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Select Study Sources</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="sourceSelectionForm" method="GET">
                        <input type="hidden" id="source_topic_id" name="topic_id">
                        <input type="hidden" id="source_course_id" name="course_id">
                        
                        <div class="sources-container">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="Kaplan" id="source_kaplan" name="sources[]">
                                <label class="form-check-label" for="source_kaplan">Kaplan</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="UWorld" id="source_uworld" name="sources[]">
                                <label class="form-check-label" for="source_uworld">UWorld</label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary mt-3">Start Quiz</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing...');
            
            // Initialize modal
            let sourceSelectionModal;
            try {
                const modalElement = document.getElementById('sourceSelectionModal');
                if (modalElement) {
                    sourceSelectionModal = new bootstrap.Modal(modalElement);
                    console.log('✅ Modal initialized successfully');
                } else {
                    console.error('❌ Modal element not found');
                }
            } catch (error) {
                console.error('❌ Modal initialization failed:', error);
            }
            
            // Setup button handlers
            const quizButtons = document.querySelectorAll('.start-quiz-btn');
            console.log(`Found ${quizButtons.length} quiz buttons`);
            
            quizButtons.forEach((button, index) => {
                console.log(`Setting up button ${index + 1}`);
                
                const originalHref = button.href;
                button.removeAttribute('href');
                button.style.cursor = 'pointer';
                
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const topicId = this.dataset.topicId;
                    const courseId = this.dataset.courseId;
                    
                    console.log(`Button clicked - Topic: ${topicId}, Course: ${courseId}`);
                    
                    // Check if this topic is part of an assignment
                    const topicCard = document.querySelector(`[data-topic-id="${topicId}"]`);
                    const hasAssignment = topicCard && topicCard.dataset.hasAssignment === 'true';
                    
                    console.log(`Has assignment: ${hasAssignment}`);
                    console.log(`Topic card data-has-assignment: ${topicCard?.dataset.hasAssignment}`);
                    
                    if (hasAssignment) {
                        console.log(`Assignment topic ${topicId}: Bypassing source modal`);
                        alert(`Assignment topic: Would redirect to ${originalHref}`);
                        return false;
                    }
                    
                    // Regular topic - show source selection modal
                    console.log(`Regular topic ${topicId}: Showing source selection modal`);
                    
                    if (!sourceSelectionModal) {
                        console.error('❌ Modal not initialized');
                        alert('Modal not initialized!');
                        return false;
                    }
                    
                    try {
                        // Set form values
                        document.getElementById('source_topic_id').value = topicId;
                        document.getElementById('source_course_id').value = courseId;
                        document.getElementById('sourceSelectionForm').action = originalHref;
                        
                        console.log('✅ Showing modal...');
                        sourceSelectionModal.show();
                        
                    } catch (error) {
                        console.error('❌ Error showing modal:', error);
                        alert('Error showing modal: ' + error.message);
                    }
                });
            });
        });
    </script>
</body>
</html>
